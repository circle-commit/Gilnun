# CameraX and the other AndroidX libraries need this; without it the build stops at
# checkDebugAarMetadata ("contains AndroidX dependencies, but android.useAndroidX is not enabled").
android.useAndroidX=true

# The Gradle daemon's default 512 MB heap is too small for Android builds.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
