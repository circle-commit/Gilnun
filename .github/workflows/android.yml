name: Android

on:
  pull_request:
    paths:
      - "frontend/Android/**"
      - "frontend/IOS_Swift/Tests/guidance_fixtures.py"
      - "frontend/IOS_Swift/Tests/detector_golden.json"
      - "backend/services/**"
      - "vision/tracker_logic.py"
      - "test_images/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "frontend/Android/**"
      - "frontend/IOS_Swift/Tests/guidance_fixtures.py"
      - "frontend/IOS_Swift/Tests/detector_golden.json"
      - "backend/services/**"
      - "vision/tracker_logic.py"
      - "test_images/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The project has no Gradle wrapper; Android Gradle Plugin 8.7 needs Gradle 8.9 or newer.
  GRADLE_VERSION: "8.11.1"

jobs:
  test:
    name: Logic and model tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Kotlin guidance logic vs. the Python backend, ONNX models vs. PyTorch references.
      - name: Run logic and model tests
        run: frontend/Android/tests/run_tests.sh

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Also compiles the app-only code (camera, speech, UI) that the tests do not cover.
      # Only the arm64 native libraries are packaged, which is what phones use; it keeps
      # the download small. Android Studio builds are unaffected.
      - name: Build debug APK
        working-directory: frontend/Android
        run: gradle assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Describe APK
        run: |
          apk=frontend/Android/app/build/outputs/apk/debug/app-debug.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          {
            echo "### Debug APK"
            echo "- Size: $(du -h "$apk" | cut -f1)"
            echo "- Native libraries: $(unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
            echo "- Permissions:"
            "$aapt2" dump permissions "$apk" | grep "uses-permission" | sed 's/^/  - /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Install on a phone to try the pull request: download, unzip, open the APK.
      # Each run signs with a fresh debug key, so uninstall an older build first.
      - uses: actions/upload-artifact@v7
        with:
          name: gilnun-android-debug-apk
          path: frontend/Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
